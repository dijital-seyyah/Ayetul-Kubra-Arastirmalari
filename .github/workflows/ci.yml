name: Âyet-ül Kübra Külliyatı Doğrulama ve Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: JSON Veri Bütünlüğü ve Mertebeleri Doğrula
        run: |
          python -c "
          import json, os
          with open('data/mertebeler.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert len(data['mertebeler']) == 33, f'Eksik mertebe var: {len(data[\"mertebeler\"])} / 33'
          print(f'✅ Toplam {len(data[\"mertebeler\"])} mertebe eksiksiz doğrulandı.')
          "

      - name: CLI Kılavuz Aracını Test Et
        run: |
          python tools/seyyah.py stats
          python tools/seyyah.py list
          python tools/seyyah.py show 1
          python tools/seyyah.py show 33
          python tools/seyyah.py search "nizam"
          python tools/seyyah.py gunun-tefekkuru
